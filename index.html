<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Test</title>

    <style>
          @media (max-width: 768px) {
        #popup {
          max-width: 85%;
          width: auto ;
          padding: 14px 16px;
          font-size: 1rem;
          max-height: 70vh
          overflow-y: auto;          
          left: 50%;
          transform: translateX(-50%);          
          border-radius: 10px;
        }
      }
    </style>

  </head>

  <body>
    <main>
      <h1>Hover Test</h1>

      <img src="BlueBelt-Expediton-2026-9.png"
           style="width:75%; height:auto;"
           usemap="#image-map"
           id="myImage">

      <map name="image-map">

        <area shape="rect" coords="91,517,384,215" data-text="As the Blue Belt Programme Officer and Cayman team lead for the Research Expedition, I’ll be onboard the R.R.S James Cook for the full 6-week expedition. In addition to being involved in all areas of research, an important part of my role is to collaborate and foster connections between the Cayman Islands, our UKOT neighbours (Anguilla and the Turks and Caicos Islands) and the UK Government.\n\n
I’m really excited to learn more about what makes the offshore banks a preferred habitat for important fish species and to discover more about the species of deep sea snapper we have and their life history.">

        <area shape="rect" coords="564,217,862,521" data-text="I have been a Research Officer with the DoE for 16 years. I have been involved in many key research projects including Nassau grouper spawning, turtle nesting, coral reef monitoring and restoration and most recently, coral spawning. It gives me great pleasure to join the team on board the R.R.S. James Cook during the upcoming research expedition.\n\n

        <area shape="rect" coords="1049,214,1331,517" data-text="I am a Marine Research Officer with the DoE, specializing in reef research and fish population dynamics. I will join the RV James Cook for the Cayman leg of the expedition and am particularly excited to expand our understanding of local pelagic ecosystems through midwater trawling, BRUV deployments, and fishing trawls.\n\n 
While our department has extensive data on nearshore reef fisheries, our knowledge of species composition and abundance in pelagic habitats remains limited. We have conducted some midwater BRUV work off the shelf and at 12-Mile Bank, and I look forward to the opportunity to replicate and extend these deployments at the more distant banks.
">

        <area shape="rect" coords="1526,215,1790,515" data-text="Growing up surrounded by the Caribbean Sea, I was captivated by the marine environment from an early age.  I learned to dive at age 10 and completed my Masters in Marine Resource Development and Protection, before starting at the DoE in 2020. I work closely with Geographic Information Systems (GIS) which provides vital mapping and data support to field research teams.\n\n
In 2022, I was offered the opportunity to join the scientific verification expedition team on Research Vessel Atlantis for a month, and became the first Caymanian to explore the Cayman Trench descending to 4,993 metres (16,381 feet) via deep-sea submersible HOV Alvin. I am thrilled to be joining my colleagues as part of the Cayman crew aboard RRS James Cook in February 2026 to continue to explore the mysteries of the deep-sea.
">

        <area shape="rect" coords="69,668,389,970" data-text="As the Coral Lab Technician and a member of the DoE’s Coral Reef Conservation Team, I work to strengthen the future of our reefs by breeding corals that have survived disease outbreaks and climate stress. In the controlled conditions of the coral lab, I help raise the offspring of these resilient corals to a healthy size so they can be planted back out in the wild and give the reef a better chance of withstanding the challenges of climate change.\n\n 
I am thrilled to join the R.R.S James Cook for the Cayman leg of the research expedition, where I’ll be investigating water chemistry and environmental DNA (eDNA) and exploring coral reefs on the offshore banks and seamounts. I’m especially excited about the chance to uncover reservoirs of healthy corals that could boost genetic diversity and resilience, and to deepen our understanding of how these offshore reef systems function within Cayman’s wider marine environment.
">

        <area shape="rect" coords="566,666,847,968" data-text="I’ve been a member of the DoE’s Coral Management Team since 2023, specializing in coral reef health and restoration, with special focus on caring for DoE’s coral nurseries. I also lead DoE’s photogrammetry project, in which coral reef health is being analysed using 3D imagery.\n\n 
During the James Cook research expedition, Megan will be a part of the camera work team, using deep sea cameras to look at the benthic environment of the seafloor and seamounts surrounding the islands. She hopes to identify and categorize the deep-sea corals that have made Cayman their home.
">

        <area shape="rect" coords="1056,668,1331,965" data-text="A conservation biologist with 15 years’ experience, I have worked extensively on Cayman’s seabird populations. Work has included the oversight of the species Conservation Plan, annual population monitoring, habitat mapping, public education and outreach as well as the tracking of Brown Booby, Red-footed Booby and Magnificent Frigatebirds.\n\n 
I very much hope to gain insight into how the local breeding populations of seabirds utilize the off-shore banks and marine habitats to bridge this significant knowledge gap, linking marine and terrestrial ecosystems in and around the Cayman Islands.
">

        <area shape="rect" coords="1526,666,1819,966" data-text="I am an Environmental Management Officer with the DoE, and I’ll be joining the R.R.S James Cook for the Cayman leg of the upcoming research expedition. I’ll be studying seabirds during the voyage and I’m especially excited to learn more about which species are using Cayman waters.\n\n 
There have been very few studies or pelagic observations in this area, so I’m really looking forward to help fill those gaps and discovering more about these incredible birds and their connection to our islands. 
">

      </map>

      <!-- Popup box -->
      <div id="popup" style="
        position:absolute;
        background:#003366;
        color:white;
        padding:8px 12px;
        border-radius:8px;
        max-width:20%;
        white-space:normal;
        pointer-events:none;
        display:none;
        font-family:sans-serif;
        z-index:10;
       max-height:70vh;
        overflow-y:auto;
      "></div>

    </main>

<script>
// --- Responsive Image Map ---
function scaleImageMap() {
  const img = document.getElementById("myImage");
  const mapName = img.getAttribute("usemap").replace("#", "");
  const map = document.querySelector(`map[name="${mapName}"]`);
  if (!img.naturalWidth) return;

  const scale = img.clientWidth / img.naturalWidth;

  map.querySelectorAll("area").forEach(area => {
    const originalCoords = area.dataset.originalCoords.split(",").map(Number);
    const scaledCoords = originalCoords.map(n => Math.round(n * scale));
    area.coords = scaledCoords.join(",");
  });
}

window.addEventListener("load", () => {
  document.querySelectorAll("area").forEach(area => {
    area.dataset.originalCoords = area.coords;
  });
  scaleImageMap();
});

window.addEventListener("resize", scaleImageMap);


// --- Popup Behavior ---
const popup = document.getElementById("popup");
const areas = document.querySelectorAll("area");
let activeArea = null;

areas.forEach(area => {

  // Desktop hover
  area.addEventListener("mouseover", (e) => {
    if (window.matchMedia("(hover:hover)").matches) {
      showPopup(area, e.pageX, e.pageY);
    }
  });

  area.addEventListener("mousemove", (e) => {
    if (window.matchMedia("(hover:hover)").matches) {
      movePopup(e.pageX, e.pageY);
    }
  });

  area.addEventListener("mouseout", () => {
    if (window.matchMedia("(hover:hover)").matches) {
      hidePopup();
    }
  });

  // Mobile tap
  area.addEventListener("click", (e) => {
    e.preventDefault();
    if (activeArea === area) {
      hidePopup();
      activeArea = null;
    } else {
      activeArea = area;
      const x = e.pageX || 0;
      const y = e.pageY || 0;
      showPopup(area, x, y);
    }
  });
});

// tap outside to close
document.addEventListener("click", (e) => {
  if (!popup.contains(e.target)) {
    hidePopup();
    activeArea = null;
  }
}, true);


// --- Helper Functions ---
function showPopup(area, x, y) {
  popup.innerHTML = area.dataset.text.replace(/\\n/g, "<br>");
  popup.style.display = "block";

  // Desktop positioning
  if (window.matchMedia("(hover:hover)").matches) {
    popup.style.left = (x + 10) + "px";
    popup.style.top = (y + 10) + "px";
  } else {
    // Mobile: top position only, horizontal center handled by CSS
    popup.style.top = (y + 20) + "px";
  }
}

function movePopup(x, y) {
  popup.style.left = (x + 10) + "px";
  popup.style.top = (y + 10) + "px";
}

function hidePopup() {
  popup.style.display = "none";
}
</script>

  </body>
</html>
