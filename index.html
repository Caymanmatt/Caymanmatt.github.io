<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Test</title>

    <style>
      /* MOBILE POPUP IMPROVEMENTS */
      @media (max-width: 768px) {
        #popup {
          max-width: 85% !important;
          width: auto !important;
          padding: 14px 16px !important;
          font-size: 1rem;
          /* max-height: 70vh !important; */
          overflow-y: auto !important;

          /* Center horizontally */
          left: 50% !important;
          transform: translateX(-50%) !important;

          /* Make tap popups look clean */
          border-radius: 10px;
        }
      }
    </style>

  </head>

  <body>
    <main>
      <h1>Hover Test</h1>

      <img src="BlueBelt-Expediton-2026-9.png"
           style="width:75%; height:auto;"
           usemap="#image-map"
           id="myImage">

      <map name="image-map">

        <area shape="rect" coords="91,517,384,215" data-text="As the Blue Belt Programme Officer and Cayman team lead for the Research Expedition, I’ll be onboard the R.R.S James Cook for the full 6-week expedition.\n\nIn addition to being involved in all areas of research, an important part of my role is to collaborate and foster connections between the Cayman Islands, our UKOT neighbours (Anguilla and the Turks and Caicos Islands) and the UK Government.\n\nI’m really excited to learn more about what makes the offshore banks a preferred habitat for important fish species and to discover more about the species of deep sea snapper we have and their life history.">

        <area shape="rect" coords="564,217,862,521" data-text="I have been a Research Officer with the DoE for 16 years. I have been involved in many key research projects including Nassau grouper spawning, turtle nesting, coral reef monitoring and restoration and most recently, coral spawning. It gives me great pleasure to join the team on board the R.R.S. James Cook during the upcoming research expedition.\n\nI would like to learn as much as I can while aboard, with particular focus on species connectivity, biodiversity & food webs offshore (pelagic & benthic), eDNA collection & analysis, biomass & abundance of key commercial fish species, hydrothermal vent ecology, water sampling for pollutants & nutrient analysis whilst offering up any knowledge I may possess from my experiences. I look forward to gaining a better understanding of the marine environments in the region to bolster our efforts in preserving them for generations to come.">

        <area shape="rect" coords="1049,214,1331,517" data-text="I am a Marine Research Officer with the Cayman Islands Department of Environment, specializing in reef research and fish population dynamics. I will join the RV James Cook for the Cayman leg of the expedition and am particularly excited to expand our understanding of local pelagic ecosystems through midwater trawling, BRUV deployments, and fishing trawls. While our department has extensive data on nearshore reef fisheries, our knowledge of species composition and abundance in pelagic habitats remains limited. We have conducted some midwater BRUV work off the shelf and at 12-Mile Bank, and I look forward to the opportunity to replicate and extend these deployments at the more distant banks.">

        <area shape="rect" coords="1526,215,1790,515" data-text="Growing up surrounded by the Caribbean Sea, I was captivated by the marine environment from an early age. I learned to dive at age 10 years old and completed my Masters in Marine Resource Development and Protection [...]">

        <area shape="rect" coords="69,668,389,970" data-text="As the Coral Lab Technician and a member of the DoE’s Coral Reef Conservation Team [...]">

        <area shape="rect" coords="566,666,847,968" data-text="I’ve been a member of the DoE’s Coral Management Team since 2023, specializing in coral reef health and restoration [...]">

        <area shape="rect" coords="1056,668,1331,965" data-text="A conservation biologist with 15 years’ experience, I have worked extensively on Cayman’s seabird populations [...]">

        <area shape="rect" coords="1526,666,1819,966" data-text="I am an Environmental Management Officer with the Cayman Islands Department of Environment [...]">

      </map>

      <!-- Popup box -->
      <div id="popup" style="
        position:absolute;
        background:#003366;
        color:white;
        padding:8px 12px;
        border-radius:8px;
        max-width:20%;
        white-space:normal;
        pointer-events:none;
        display:none;
        font-family:sans-serif;
        z-index:10;
       /* max-height:70vh; */
        overflow-y:auto;
      "></div>

    </main>

<script>
// --- Responsive Image Map ---
function scaleImageMap() {
  const img = document.getElementById("myImage");
  const mapName = img.getAttribute("usemap").replace("#", "");
  const map = document.querySelector(`map[name="${mapName}"]`);
  if (!img.naturalWidth) return;

  const scale = img.clientWidth / img.naturalWidth;

  map.querySelectorAll("area").forEach(area => {
    const originalCoords = area.dataset.originalCoords.split(",").map(Number);
    const scaledCoords = originalCoords.map(n => Math.round(n * scale));
    area.coords = scaledCoords.join(",");
  });
}

window.addEventListener("load", () => {
  document.querySelectorAll("area").forEach(area => {
    area.dataset.originalCoords = area.coords;
  });
  scaleImageMap();
});

window.addEventListener("resize", scaleImageMap);


// --- Popup Behavior ---
const popup = document.getElementById("popup");
const areas = document.querySelectorAll("area");
let activeArea = null;

areas.forEach(area => {

  // Desktop hover
  area.addEventListener("mouseover", (e) => {
    if (window.matchMedia("(hover:hover)").matches) {
      showPopup(area, e.pageX, e.pageY);
    }
  });

  area.addEventListener("mousemove", (e) => {
    if (window.matchMedia("(hover:hover)").matches) {
      movePopup(e.pageX, e.pageY);
    }
  });

  area.addEventListener("mouseout", () => {
    if (window.matchMedia("(hover:hover)").matches) {
      hidePopup();
    }
  });

  // Mobile tap
  area.addEventListener("click", (e) => {
    e.preventDefault();
    if (activeArea === area) {
      hidePopup();
      activeArea = null;
    } else {
      activeArea = area;
      const x = e.pageX || 0;
      const y = e.pageY || 0;
      showPopup(area, x, y);
    }
  });
});

// tap outside to close
document.addEventListener("click", (e) => {
  if (!popup.contains(e.target)) {
    hidePopup();
    activeArea = null;
  }
}, true);


// --- Helper Functions ---
function showPopup(area, x, y) {
  popup.innerHTML = area.dataset.text.replace(/\\n/g, "<br>");
  popup.style.display = "block";

  // Desktop positioning
  if (window.matchMedia("(hover:hover)").matches) {
    popup.style.left = (x + 10) + "px";
    popup.style.top = (y + 10) + "px";
  } else {
    // Mobile: top position only, horizontal center handled by CSS
    popup.style.top = (y + 20) + "px";
  }
}

function movePopup(x, y) {
  popup.style.left = (x + 10) + "px";
  popup.style.top = (y + 10) + "px";
}

function hidePopup() {
  popup.style.display = "none";
}
</script>

  </body>
</html>
